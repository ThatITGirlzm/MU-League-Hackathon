version: '3.8'

services:
  hackathon-mongodb:
    image: mongo:5.0
    container_name: hackathon_mongodb
    ports:
      - "27017:27017"
    volumes:
      - hackathon_mongo_data:/data/db
    restart: always

  hackathon-mongo-express:
    image: mongo-express:latest
    container_name: hackathon_mongo_express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://hackathon-mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - hackathon-mongodb

volumes:
  hackathon_mongo_data:
